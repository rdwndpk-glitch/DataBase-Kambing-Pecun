<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Desk Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-row { animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-box { animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .glass-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.85));
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.15);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-[#070d19] to-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <!-- ==================== 1. LAYAR LOGIN ==================== -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md glass-card rounded-3xl p-8 shadow-[0_20px_60px_-15px_rgba(14,165,233,0.15)] space-y-6 animate-box border border-cyan-500/20">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3.5 bg-gradient-to-tr from-blue-600/30 to-cyan-500/30 text-cyan-300 rounded-2xl text-2xl ring-1 ring-cyan-400/30">🔐</div>
        <h2 class="text-2xl font-extrabold tracking-tight text-white">DeskCol Access</h2>
        <p class="text-xs text-slate-400">Portal Manajemen Penagihan & Settlement</p>
      </div>

      <div id="login-error" class="hidden bg-rose-950/70 border border-rose-500/40 text-rose-200 text-xs p-3 rounded-2xl text-center"></div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="text-slate-300 block mb-1.5 font-medium">ID Agent</label>
          <input type="text" id="log-id" required placeholder="Contoh: RIDWAN" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3 text-white focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20 uppercase tracking-wider transition">
        </div>

        <div>
          <label class="text-slate-300 block mb-1.5 font-medium">Password</label>
          <input type="password" id="log-pw" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3 text-white focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20 transition">
        </div>

        <button type="submit" id="btn-login" class="w-full bg-gradient-to-r from-blue-600 via-cyan-600 to-teal-500 hover:from-blue-500 hover:to-cyan-400 text-white font-semibold py-3 rounded-2xl transition duration-300 shadow-lg shadow-cyan-600/25 hover:scale-[1.02] active:scale-[0.98]">
          Masuk ke Portal
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 2. DASHBOARD ==================== -->
  <div id="dashboard-screen" class="hidden max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center glass-card p-5 md:p-6 rounded-3xl shadow-xl gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="p-2.5 bg-cyan-500/20 text-cyan-300 rounded-2xl text-xl ring-1 ring-cyan-400/30">⚡</span>
          <h1 class="text-xl md:text-2xl font-black text-white tracking-tight">DeskCol <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">Portal</span></h1>
        </div>
        <p class="text-xs text-slate-400 mt-1">
          Login sebagai: <span id="current-agent-display" class="text-cyan-300 font-semibold"></span> (<span id="current-agent-id" class="text-slate-400 font-mono"></span>)
        </p>
      </div>
      
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <input type="text" id="in-search" oninput="handleSearch()" placeholder="🔍 Cari nama, nomor kontrak..." class="bg-slate-900/90 border border-slate-700 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400 flex-1 md:w-64 transition">
        <button onclick="toggleModal('modal-form', true)" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-semibold px-4 py-2.5 rounded-2xl text-xs transition duration-200 shadow-lg shadow-cyan-500/25 hover:scale-105 active:scale-95">
          + Input Data
        </button>
        <button onclick="handleLogout()" class="bg-slate-800/80 hover:bg-rose-950/70 hover:text-rose-300 text-slate-300 px-4 py-2.5 rounded-2xl text-xs transition border border-slate-700">
          Keluar
        </button>
      </div>
    </header>

    <!-- Tab Filter -->
    <div class="flex flex-wrap gap-2.5 border-b border-slate-800/80 pb-3 text-xs">
      <button onclick="applyFilter('ALL')" id="tab-ALL" class="tab-btn px-4 py-2 rounded-xl font-semibold bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md shadow-cyan-600/30">Semua Nasabah</button>
      <button onclick="applyFilter('PTP')" id="tab-PTP" class="tab-btn px-4 py-2 rounded-xl font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/70 border border-transparent hover:border-slate-700">Janji Bayar (PTP)</button>
      <button onclick="applyFilter('SKIP')" id="tab-SKIP" class="tab-btn px-4 py-2 rounded-xl font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/70 border border-transparent hover:border-slate-700">Skip Tracing</button>
      <button onclick="applyFilter('PAID')" id="tab-PAID" class="tab-btn px-4 py-2 rounded-xl font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/70 border border-transparent hover:border-slate-700">Paid / Settlement</button>
    </div>

    <!-- Tabel Database -->
    <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900/90 text-slate-400 uppercase tracking-wider border-b border-slate-800 text-[11px]">
            <tr>
              <th class="p-4">User ID & Kontrak</th>
              <th class="p-4">User Name</th>
              <th class="p-4">Phone</th>
              <th class="p-4">Skip Tracing</th>
              <th class="p-4">PTP (Janji Bayar)</th>
              <th class="p-4">Paid Settlement</th>
              <th class="p-4">Agent</th>
              <th class="p-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-800/60">
            <tr>
              <td colspan="8" class="p-10 text-center text-slate-400 animate-pulse">Menghubungkan ke database nasabah...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL INPUT DATA BARU -->
  <div id="modal-form" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 animate-box">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><span>📝</span> Input Nasabah Baru</h3>
        <button onclick="toggleModal('modal-form', false)" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <form id="desk-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-300 block mb-1 font-medium">User ID (Opsional)</label>
            <input type="text" id="f-userid" placeholder="Auto ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="text-slate-300 block mb-1 font-medium">Nomor Kontrak *</label>
            <input type="text" id="f-kontrak" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-300 block mb-1 font-medium">Nama Nasabah *</label>
            <input type="text" id="f-nama" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="text-slate-300 block mb-1 font-medium">No. Phone *</label>
            <input type="text" id="f-phone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div>
          <label class="text-slate-300 block mb-1 font-medium">Skip Tracing (Nomor Baru / Kontak Darurat)</label>
          <input type="text" id="f-skip" placeholder="08129999xxxx (Adik Kandung)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
        </div>

        <div>
          <label class="text-slate-300 block mb-1 font-medium">PTP (Komitmen Janji Bayar & Tanggal)</label>
          <input type="text" id="f-ptp" placeholder="Janji tgl 25/09 (Rp 1.500.000)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-300 block mb-1 font-medium">Paid Settlement</label>
            <input type="text" id="f-paid" placeholder="TRX-1234 / Lunas" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="text-slate-300 block mb-1 font-medium">Agent Bertugas</label>
            <input type="text" id="f-agent" readonly class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-400 font-semibold cursor-not-allowed">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" onclick="toggleModal('modal-form', false)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl transition">Batal</button>
          <button type="submit" id="btn-save" class="px-5 py-2 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-medium rounded-xl shadow-lg shadow-cyan-600/30 hover:brightness-110 transition">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EDIT DATA / UPDATE STATUS -->
  <div id="modal-edit" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 animate-box">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div>
          <h3 class="text-sm font-bold text-white flex items-center gap-2"><span>✏️</span> Perbarui Status Nasabah</h3>
          <p id="edit-nasabah-label" class="text-xs text-cyan-400 font-medium mt-0.5"></p>
        </div>
        <button onclick="toggleModal('modal-edit', false)" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <form id="edit-form" onsubmit="handleEditSubmit(event)" class="space-y-3 text-xs">
        <input type="hidden" id="edit-row-index">

        <div>
          <label class="text-slate-300 block mb-1 font-medium">Skip Tracing (Nomor Baru / Info Alamat)</label>
          <input type="text" id="edit-skip" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
        </div>

        <div>
          <label class="text-slate-300 block mb-1 font-medium">Info PTP (Janji Bayar)</label>
          <input type="text" id="edit-ptp" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
        </div>

        <div>
          <label class="text-emerald-300 block mb-1 font-semibold">Paid Settlement (Ketik No. Ref atau Bukti Lunas)</label>
          <input type="text" id="edit-paid" placeholder="Contoh: LUNAS DISKON (TRX-9892)" class="w-full bg-slate-950 border border-emerald-500/50 rounded-xl p-2.5 text-emerald-300 font-semibold focus:outline-none focus:ring-1 focus:ring-emerald-400">
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" onclick="toggleModal('modal-edit', false)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl transition">Batal</button>
          <button type="submit" id="btn-update-save" class="px-5 py-2 bg-gradient-to-r from-emerald-600 to-teal-500 text-white font-medium rounded-xl shadow-lg shadow-emerald-500/20 hover:brightness-110 transition">Update Status</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxDLagYJMbiXUIHOm8njNVRbT0tKk46VBHn-syHdzU4TRWBYTzwhPsSrhxjiBoqkVEF/exec";

    let currentAgent = null;
    let sheetData = [];
    let currentTab = 'ALL';
    let searchFilter = '';

    window.onload = function() {
      const savedAgent = localStorage.getItem("deskcol_user");
      if (savedAgent) {
        currentAgent = JSON.parse(savedAgent);
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      errBox.classList.add('hidden');
      btn.innerText = 'Memverifikasi...';
      btn.disabled = true;

      const agentId = document.getElementById('log-id').value.trim();
      const password = document.getElementById('log-pw').value.trim();

      fetch(`${API_URL}?action=login&agentId=${encodeURIComponent(agentId)}&password=${encodeURIComponent(password)}`)
        .then(res => res.json())
        .then(res => {
          btn.innerText = 'Masuk ke Portal';
          btn.disabled = false;

          if (res.success) {
            currentAgent = { id: res.agentId, name: res.agentName };
            localStorage.setItem("deskcol_user", JSON.stringify(currentAgent));
            showDashboard();
          } else {
            errBox.innerText = res.message || "ID Agent atau Password salah!";
            errBox.classList.remove('hidden');
          }
        })
        .catch(err => {
          btn.innerText = 'Masuk ke Portal';
          btn.disabled = false;
          errBox.innerText = "Gagal terhubung ke database. Pastikan koneksi internet aktif.";
          errBox.classList.remove('hidden');
        });
    }

    function showDashboard() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      document.getElementById('current-agent-display').innerText = currentAgent.name;
      document.getElementById('current-agent-id').innerText = currentAgent.id;
      document.getElementById('f-agent').value = currentAgent.name;
      fetchData();
    }

    function handleLogout() {
      localStorage.removeItem("deskcol_user");
      currentAgent = null;
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('log-id').value = '';
      document.getElementById('log-pw').value = '';
    }

    function fetchData() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          sheetData = data || [];
          renderRows();
        })
        .catch(err => {
          console.error(err);
          document.getElementById('table-body').innerHTML = '<tr><td colspan="8" class="p-8 text-center text-rose-400">Gagal memuat database nasabah.</td></tr>';
        });
    }

    function renderRows() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      let list = sheetData.map((row, idx) => ({ ...row, originalRowIndex: idx + 2 }))
        .filter(row => {
          const hasSkip = row[4] && row[4] !== '-' && row[4] !== '';
          const hasPTP = row[5] && row[5] !== '-' && row[5] !== '';
          const hasPaid = row[6] && row[6] !== '-' && row[6] !== '';

          if (currentTab === 'PTP' && !hasPTP) return false;
          if (currentTab === 'SKIP' && !hasSkip) return false;
          if (currentTab === 'PAID' && !hasPaid) return false;

          if (searchFilter) {
            const combined = (row[0] + ' ' + row[1] + ' ' + row[2] + ' ' + row[3] + ' ' + row[7]).toLowerCase();
            if (!combined.includes(searchFilter)) return false;
          }

          return true;
        });

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-500">Tidak ada catatan data yang cocok.</td></tr>';
        return;
      }

      list.forEach((r, i) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition duration-150 animate-row border-b border-slate-800/50';
        tr.style.animationDelay = (i * 0.03) + 's';

        const skipBadge = (r[4] && r[4] !== '-') ? `<span class="bg-amber-500/15 border border-amber-500/40 text-amber-300 px-2.5 py-1 rounded-xl text-xs font-mono inline-block shadow-sm">${r[4]}</span>` : `<span class="text-slate-600">-</span>`;
        const ptpBadge = (r[5] && r[5] !== '-') ? `<span class="bg-cyan-500/15 border border-cyan-500/40 text-cyan-300 px-2.5 py-1 rounded-xl text-xs font-mono inline-block shadow-sm">${r[5]}</span>` : `<span class="text-slate-600">-</span>`;
        const paidBadge = (r[6] && r[6] !== '-') ? `<span class="bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 px-2.5 py-1 rounded-xl text-xs font-mono inline-block shadow-sm font-semibold">${r[6]}</span>` : `<span class="text-slate-600">-</span>`;

        tr.innerHTML = `
          <td class="p-4">
            <span class="font-mono text-xs text-slate-400 block">${r[0]}</span>
            <span class="font-bold text-white">${r[2]}</span>
          </td>
          <td class="p-4 font-semibold text-slate-100">${r[1]}</td>
          <td class="p-4 font-mono text-cyan-400/90">${r[3]}</td>
          <td class="p-4 max-w-xs">${skipBadge}</td>
          <td class="p-4 max-w-xs">${ptpBadge}</td>
          <td class="p-4 max-w-xs">${paidBadge}</td>
          <td class="p-4 text-slate-300 font-medium">${r[7]}</td>
          <td class="p-4 text-center">
            <button onclick="openEditModal(${r.originalRowIndex}, '${encodeURIComponent(r[1])}', '${encodeURIComponent(r[4] || '')}', '${encodeURIComponent(r[5] || '')}', '${encodeURIComponent(r[6] || '')}')" class="bg-slate-800 hover:bg-cyan-600 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl border border-slate-700 transition duration-200 text-xs shadow hover:scale-105">
              ✏️ Update
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openEditModal(rowIndex, nama, skip, ptp, paid) {
      document.getElementById('edit-row-index').value = rowIndex;
      document.getElementById('edit-nasabah-label').innerText = decodeURIComponent(nama);
      document.getElementById('edit-skip').value = (decodeURIComponent(skip) === '-') ? '' : decodeURIComponent(skip);
      document.getElementById('edit-ptp').value = (decodeURIComponent(ptp) === '-') ? '' : decodeURIComponent(ptp);
      document.getElementById('edit-paid').value = (decodeURIComponent(paid) === '-') ? '' : decodeURIComponent(paid);
      toggleModal('modal-edit', true);
    }

    function handleEditSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-update-save');
      btn.innerText = 'Mengupdate...';
      btn.disabled = true;

      const payload = {
        action: "update",
        rowIndex: parseInt(document.getElementById('edit-row-index').value),
        skipTracing: document.getElementById('edit-skip').value.trim(),
        ptp: document.getElementById('edit-ptp').value.trim(),
        paidSettlement: document.getElementById('edit-paid').value.trim(),
        agentName: currentAgent.name
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.innerText = 'Update Status';
        btn.disabled = false;
        toggleModal('modal-edit', false);
        setTimeout(fetchData, 1200);
      })
      .catch(err => {
        alert("Gagal mengupdate data!");
        btn.innerText = 'Update Status';
        btn.disabled = false;
      });
    }

    function applyFilter(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-xl font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/70 border border-transparent hover:border-slate-700 transition';
      });
      document.getElementById('tab-' + tab).className = 'tab-btn px-4 py-2 rounded-xl font-semibold bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md shadow-cyan-600/30 transition';
      renderRows();
    }

    function handleSearch() {
      searchFilter = document.getElementById('in-search').value.toLowerCase().trim();
      renderRows();
    }

    function toggleModal(modalId, open) {
      const modal = document.getElementById(modalId);
      if (open) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
      else { modal.classList.add('hidden'); modal.classList.remove('flex'); }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('btn-save');
      saveBtn.innerText = 'Menyimpan...';
      saveBtn.disabled = true;

      const payload = {
        userId: document.getElementById('f-userid').value.trim(),
        userName: document.getElementById('f-nama').value.trim(),
        noKontrak: document.getElementById('f-kontrak').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        skipTracing: document.getElementById('f-skip').value.trim(),
        ptp: document.getElementById('f-ptp').value.trim(),
        paidSettlement: document.getElementById('f-paid').value.trim(),
        agentName: currentAgent.name
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        saveBtn.innerText = 'Simpan Data';
        saveBtn.disabled = false;
        toggleModal('modal-form', false);
        document.getElementById('desk-form').reset();
        document.getElementById('f-agent').value = currentAgent.name;
        setTimeout(fetchData, 1000);
      })
      .catch(err => {
        alert("Gagal menyimpan data!");
        saveBtn.innerText = 'Simpan Data';
        saveBtn.disabled = false;
      });
    }
