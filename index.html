<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Desk Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-row { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-box { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- ==================== 1. LAYAR LOGIN ==================== -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 animate-box">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-blue-600/20 text-blue-400 rounded-2xl text-2xl mb-1">🔐</div>
        <h2 class="text-2xl font-black tracking-tight text-white">DeskCol Access</h2>
        <p class="text-xs text-slate-400">Silakan login menggunakan ID Agent Anda</p>
      </div>

      <div id="login-error" class="hidden bg-rose-950/50 border border-rose-800 text-rose-300 text-xs p-3 rounded-xl text-center"></div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="text-slate-400 block mb-1.5 font-medium">ID Agent</label>
          <input type="text" id="log-id" required placeholder="Contoh: AG01" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 uppercase tracking-wider">
        </div>

        <div>
          <label class="text-slate-400 block mb-1.5 font-medium">Password</label>
          <input type="password" id="log-pw" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
        </div>

        <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30 hover:scale-[1.02] active:scale-[0.98]">
          Masuk ke Portal
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 2. HALAMAN UTAMA / DASHBOARD ==================== -->
  <div id="dashboard-screen" class="hidden max-w-7xl mx-auto p-4 md:p-6 space-y-5">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900/90 border border-slate-800 p-5 rounded-3xl shadow-2xl gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="p-2 bg-blue-600/20 text-blue-400 rounded-xl text-lg">📞</span>
          <h1 class="text-xl font-black text-white tracking-tight">DeskCol Portal</h1>
        </div>
        <p class="text-xs text-slate-400 mt-1">
          Login sebagai: <span id="current-agent-display" class="text-blue-400 font-semibold"></span> (<span id="current-agent-id" class="text-slate-500 font-mono"></span>)
        </p>
      </div>
      
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <input type="text" id="in-search" oninput="handleSearch()" placeholder="🔍 Cari nasabah, kontrak..." class="bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2 text-xs text-white focus:outline-none focus:border-blue-500 flex-1 md:w-60">
        <button onclick="toggleModal(true)" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-2xl text-xs transition hover:scale-105 active:scale-95 shadow-lg shadow-blue-600/30">
          + Input Data
        </button>
        <button onclick="handleLogout()" class="bg-slate-800 hover:bg-rose-950/60 hover:text-rose-400 text-slate-400 px-3.5 py-2 rounded-2xl text-xs transition border border-slate-700/60">
          Keluar
        </button>
      </div>
    </header>

    <!-- Tab Filter -->
    <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3 text-xs">
      <button onclick="applyFilter('ALL')" id="tab-ALL" class="tab-btn px-4 py-2 rounded-xl font-semibold bg-blue-600 text-white transition hover:scale-105">Semua Nasabah</button>
      <button onclick="applyFilter('PTP')" id="tab-PTP" class="tab-btn px-4 py-2 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition hover:scale-105">Janji Bayar (PTP)</button>
      <button onclick="applyFilter('SKIP')" id="tab-SKIP" class="tab-btn px-4 py-2 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition hover:scale-105">Skip Tracing</button>
      <button onclick="applyFilter('PAID')" id="tab-PAID" class="tab-btn px-4 py-2 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition hover:scale-105">Paid / Settlement</button>
    </div>

    <!-- Tabel Database -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900 text-slate-400 uppercase tracking-wider border-b border-slate-800 text-[11px]">
            <tr>
              <th class="p-4">User ID & Kontrak</th>
              <th class="p-4">User Name</th>
              <th class="p-4">Phone</th>
              <th class="p-4">Skip Tracing</th>
              <th class="p-4">PTP (Janji Bayar)</th>
              <th class="p-4">Paid Settlement</th>
              <th class="p-4">Agent</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-800/60">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400 animate-pulse">Memuat database nasabah...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Input Data -->
  <div id="modal-form" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 animate-box">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white">Input Catatan Penagihan</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <form id="desk-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">User ID (Opsional)</label>
            <input type="text" id="f-userid" placeholder="Auto ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Nomor Kontrak *</label>
            <input type="text" id="f-kontrak" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">Nama Nasabah *</label>
            <input type="text" id="f-nama" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">No. Phone *</label>
            <input type="text" id="f-phone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="text-slate-400 block mb-1">Skip Tracing (Nomor Baru / Alamat)</label>
          <input type="text" id="f-skip" placeholder="0857xxx (Kontak Ibu)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="text-slate-400 block mb-1">PTP (Komitmen Janji Bayar)</label>
          <input type="text" id="f-ptp" placeholder="Janji tgl 28/09 (Rp 1.000.000)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">Paid Settlement</label>
            <input type="text" id="f-paid" placeholder="TRX-1234 / Lunas" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Agent Bertugas</label>
            <input type="text" id="f-agent" readonly class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-400 font-semibold cursor-not-allowed">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl">Batal</button>
          <button type="submit" id="btn-save" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition shadow-lg shadow-blue-500/25">Simpan ke Sheets</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // URL Web App Apps Script aktif
    const API_URL = "https://script.google.com/macros/s/AKfycbxDLagYJMbiXUIHOm8njNVRbT0tKk46VBHn-syHdzU4TRWBYTzwhPsSrhxjiBoqkVEF/exec";

    let currentAgent = null;
    let sheetData = [];
    let currentTab = 'ALL';
    let searchFilter = '';

    window.onload = function() {
      const savedAgent = localStorage.getItem("deskcol_user");
      if (savedAgent) {
        currentAgent = JSON.parse(savedAgent);
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      errBox.classList.add('hidden');
      btn.innerText = 'Memverifikasi...';
      btn.disabled = true;

      const agentId = document.getElementById('log-id').value.trim();
      const password = document.getElementById('log-pw').value.trim();

      fetch(`${API_URL}?action=login&agentId=${encodeURIComponent(agentId)}&password=${encodeURIComponent(password)}`)
        .then(res => res.json())
        .then(res => {
          btn.innerText = 'Masuk ke Portal';
          btn.disabled = false;

          if (res.success) {
            currentAgent = { id: res.agentId, name: res.agentName };
            localStorage.setItem("deskcol_user", JSON.stringify(currentAgent));
            showDashboard();
          } else {
            errBox.innerText = res.message || "ID Agent atau Password salah!";
            errBox.classList.remove('hidden');
          }
        })
        .catch(err => {
          btn.innerText = 'Masuk ke Portal';
          btn.disabled = false;
          errBox.innerText = "Gagal terhubung ke database. Pastikan koneksi aman dan deploy sudah diset Anyone.";
          errBox.classList.remove('hidden');
        });
    }

    function showDashboard() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      document.getElementById('current-agent-display').innerText = currentAgent.name;
      document.getElementById('current-agent-id').innerText = currentAgent.id;
      document.getElementById('f-agent').value = currentAgent.name;
      fetchData();
    }

    function handleLogout() {
      localStorage.removeItem("deskcol_user");
      currentAgent = null;
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('log-id').value = '';
      document.getElementById('log-pw').value = '';
    }

    function fetchData() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          sheetData = data || [];
          renderRows();
        })
        .catch(err => {
          console.error(err);
          document.getElementById('table-body').innerHTML = '<tr><td colspan="7" class="p-8 text-center text-rose-400">Gagal memuat database nasabah.</td></tr>';
        });
    }

    function renderRows() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      let list = sheetData.filter(row => {
        const hasSkip = row[4] && row[4] !== '-' && row[4] !== '';
        const hasPTP = row[5] && row[5] !== '-' && row[5] !== '';
        const hasPaid = row[6] && row[6] !== '-' && row[6] !== '';

        if (currentTab === 'PTP' && !hasPTP) return false;
        if (currentTab === 'SKIP' && !hasSkip) return false;
        if (currentTab === 'PAID' && !hasPaid) return false;

        if (searchFilter) {
          const combined = (row[0] + ' ' + row[1] + ' ' + row[2] + ' ' + row[3] + ' ' + row[7]).toLowerCase();
          if (!combined.includes(searchFilter)) return false;
        }

        return true;
      });

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500">Tidak ada catatan data.</td></tr>';
        return;
      }

      list.forEach((r, i) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/50 transition animate-row border-b border-slate-800/50';
        tr.style.animationDelay = (i * 0.03) + 's';

        const skipBadge = (r[4] && r[4] !== '-') ? `<span class="bg-amber-950/60 border border-amber-800 text-amber-300 px-2.5 py-1 rounded-xl text-xs font-mono inline-block">${r[4]}</span>` : `<span class="text-slate-600">-</span>`;
        const ptpBadge = (r[5] && r[5] !== '-') ? `<span class="bg-blue-950/60 border border-blue-800 text-blue-300 px-2.5 py-1 rounded-xl text-xs font-mono inline-block">${r[5]}</span>` : `<span class="text-slate-600">-</span>`;
        const paidBadge = (r[6] && r[6] !== '-') ? `<span class="bg-emerald-950/60 border border-emerald-800 text-emerald-300 px-2.5 py-1 rounded-xl text-xs font-mono inline-block">${r[6]}</span>` : `<span class="text-slate-600">-</span>`;

        tr.innerHTML = `
          <td class="p-4">
            <span class="font-mono text-xs text-slate-400 block">${r[0]}</span>
            <span class="font-bold text-white">${r[2]}</span>
          </td>
          <td class="p-4 font-semibold text-slate-200">${r[1]}</td>
          <td class="p-4 font-mono text-slate-400">${r[3]}</td>
          <td class="p-4 max-w-xs">${skipBadge}</td>
          <td class="p-4 max-w-xs">${ptpBadge}</td>
          <td class="p-4 max-w-xs">${paidBadge}</td>
          <td class="p-4 text-slate-300 font-medium">${r[7]}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function applyFilter(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-xl font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition hover:scale-105';
      });
      document.getElementById('tab-' + tab).className = 'tab-btn px-4 py-2 rounded-xl font-semibold bg-blue-600 text-white transition hover:scale-105';
      renderRows();
    }

    function handleSearch() {
      searchFilter = document.getElementById('in-search').value.toLowerCase().trim();
      renderRows();
    }

    function toggleModal(open) {
      const modal = document.getElementById('modal-form');
      if (open) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
      else { modal.classList.add('hidden'); modal.classList.remove('flex'); }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('btn-save');
      saveBtn.innerText = 'Menyimpan...';
      saveBtn.disabled = true;

      const payload = {
        userId: document.getElementById('f-userid').value.trim(),
        userName: document.getElementById('f-nama').value.trim(),
        noKontrak: document.getElementById('f-kontrak').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        skipTracing: document.getElementById('f-skip').value.trim(),
        ptp: document.getElementById('f-ptp').value.trim(),
        paidSettlement: document.getElementById('f-paid').value.trim(),
        agentName: currentAgent.name
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        saveBtn.innerText = 'Simpan ke Sheets';
        saveBtn.disabled = false;
        toggleModal(false);
        document.getElementById('desk-form').reset();
        document.getElementById('f-agent').value = currentAgent.name;
        setTimeout(fetchData, 1000);
      })
      .catch(err => {
        alert("Gagal menyimpan data!");
        saveBtn.innerText = 'Simpan ke Sheets';
        saveBtn.disabled = false;
      });
    }
  </script>
</body>
</html>
